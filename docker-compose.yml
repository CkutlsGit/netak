services:
  postgres:
    container_name: postgres
    image: 'postgres:18.6-alpine3.23'
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - dbnet
    restart: always
  netak:
    container_name: netak
    build: .
    image: netak
    ports:
      - '127.0.0.1:8080:8080'
    networks:
      - dbnet
    depends_on:
      - postgres
    restart: always

volumes:
  postgres-data:

networks:
  dbnet:
    driver: bridge